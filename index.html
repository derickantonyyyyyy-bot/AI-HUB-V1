
<!DOCTYPE html>
<html lang="en">

                <h2>ChatGPT</h2>
                <p>Explore ideas and create with AI.</p>
                <button onclick="openAI('chatgpt')">
                    Open ChatGPT →
                </button>
            </div>

            <div class="ai-card">
                <h2>Claude</h2>
                <p>Think, write and build with AI.</p>
                <button onclick="openAI('claude')">
                    Open Claude →
                </button>
            </div>

            <div class="ai-card">
                <h2>Gemini</h2>
                <p>Discover and explore with AI.</p>
                <button onclick="openAI('gemini')">
                    Open Gemini →
                </button>
            </div>

        </section>

    </main>

    <footer>
        AI HUB © 2026 | Built for everyone.
    </footer>

    <script src="script.js"></script>

</html>
